<script>
(function(){
  const RPC='https://bsc-dataseed.binance.org/';
  const USDT='0x55d398326f99059fF775485246999027B3197955'.toLowerCase();
  const TOPIC='0x1d3Dd8A3Cf438d62cC965E7EB9E83E494e7F56F7';
  let lastSeen='';
  const $=id=>document.getElementById(id);
  const short=a=>a ? a.slice(0,6)+' ... '+a.slice(-4) : '—';
  const hex=n=>'0x'+n.toString(16);
  async function rpc(method,params=[]){
    const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:Date.now(),method,params})});
    const j=await r.json(); if(j.error) throw new Error(j.error.message||'RPC error'); return j.result;
  }
  function topicAddress(a){return '0x'+a.replace(/^0x/,'').toLowerCase().padStart(64,'0');}
  function getInputAddress(){
    const el=document.querySelector('input[placeholder="Search or Enter"]');
    const a=(el?.value||'').trim();
    return /^0x[0-9a-fA-F]{40}$/.test(a)?a.toLowerCase():null;
  }
  async function findTransfers(address){
    const latest=parseInt(await rpc('eth_blockNumber'),16);
    const start=Math.max(0,latest-12000);
    const logs=[];
    // Query small ranges because public BSC RPC endpoints can reject large eth_getLogs ranges.
    for(let from=start;from<=latest;from+=500){
      const to=Math.min(latest,from+499);
      for(const topics of [[TOPIC,topicAddress(address)],[TOPIC,null,topicAddress(address)]]){
        try{
          const part=await rpc('eth_getLogs',[{fromBlock:hex(from),toBlock:hex(to),address:USDT,topics}]);
          logs.push(...part);
        }catch(e){}
      }
    }
    const unique=[...new Map(logs.map(x=>[x.transactionHash+':'+x.logIndex,x])).values()];
    unique.sort((a,b)=>parseInt(a.blockNumber,16)-parseInt(b.blockNumber,16)||parseInt(a.logIndex,16)-parseInt(b.logIndex,16));
    return unique;
  }
  async function showTransfer(log){
    if(!log || !log.transactionHash || log.transactionHash===lastSeen) return;
    try{
      const [tx,receipt,block]=await Promise.all([
        rpc('eth_getTransactionByHash',[log.transactionHash]),
        rpc('eth_getTransactionReceipt',[log.transactionHash]),
        rpc('eth_getBlockByNumber',[log.blockNumber,false])
      ]);
      if(!tx||!receipt||!block) return;
      const from='0x'+log.topics[1].slice(-40);
      const to='0x'+log.topics[2].slice(-40);
      const amount=Number(BigInt(log.data))/1e18;
      const fee=Number(BigInt(receipt.gasUsed)*BigInt(tx.gasPrice||'0x0'))/1e18;
      const date=new Date(parseInt(block.timestamp,16)*1000);
      $('tx-amount').textContent='- '+amount.toLocaleString(undefined,{maximumFractionDigits:6})+' USDT';
      $('tx-usd').textContent='≈ $'+amount.toLocaleString(undefined,{maximumFractionDigits:2});
      $('tx-date').textContent=date.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      const ok=receipt.status==='0x1';
      $('tx-status').textContent=ok?'Completed':'Failed';
      $('tx-status').className='tx-value '+(ok?'tx-status':'tx-failed');
      $('tx-from').textContent=short(from);
      $('tx-to').textContent=short(to);
      $('tx-fee').textContent=fee.toFixed(6)+' BNB';
      $('tx-nonce').textContent=String(parseInt(tx.nonce,16));
      $('tx-more').onclick=()=>window.open('https://bscscan.com/tx/'+log.transactionHash,'_blank','noopener');
      lastSeen=log.transactionHash;
      $('tx-details-modal').classList.add('show');
      $('tx-details-modal').setAttribute('aria-hidden','false');
    }catch(e){console.warn('Transaction details:',e);}
  }
  async function poll(){
    const address=getInputAddress(); if(!address) return;
    try{const logs=await findTransfers(address); if(logs.length) await showTransfer(logs[logs.length-1]);}catch(e){console.warn('Transfer lookup:',e);}
  }
  $('tx-close').addEventListener('click',()=>{$('tx-details-modal').classList.remove('show');$('tx-details-modal').setAttribute('aria-hidden','true');});
  // Expose this so the existing main.js can open the same screen when it receives a real tx hash.
  window.showRealUSDTTransaction=async function(hash){
    if(!hash) return;
    try{
      const receipt=await rpc('eth_getTransactionReceipt',[hash]);
      const logs=(receipt?.logs||[]).filter(x=>String(x.address).toLowerCase()===USDT && String(x.topics?.[0]).toLowerCase()===TOPIC);
      if(logs.length) await showTransfer(logs[logs.length-1]);
    }catch(e){console.warn(e);}
  };
  setTimeout(poll,2000);
  setInterval(poll,10000);
})();
</script>
